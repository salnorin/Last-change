<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Last-change</title>
<style>
body{font-family:system-ui,Tahoma,sans-serif;max-width:900px;margin:auto;padding:1rem;background:#111;color:#eee}
input,select,textarea,button{font:inherit;padding:.4rem;margin:.2rem;background:#222;color:#eee;border:1px solid #444;border-radius:6px}
button{cursor:pointer;background:#2b5}.card{border:1px solid #333;border-radius:8px;padding:.6rem;margin:.5rem 0}
.muted{color:#999;font-size:.85em}code{word-break:break-all}.legal{border:1px solid #a63;padding:.5rem;border-radius:6px;font-size:.85em}
section{margin:1rem 0}
</style></head><body>
<h1>Last-change</h1>
<p class="legal">⚠️ بدون توکن، بدون پرداخت، بدون نگهداری پول. کالا و خدمات غیرقانونی ممنوع است؛ ناشناس بودن کسی را از قانون معاف نمی‌کند. / No token, no payments. Illegal goods forbidden.</p>
<p class="muted">شناسه‌ی مستعار شما: <code id="me"></code></p>

<section><h2>ثبت آگهی</h2>
<select id="kind"><option value="offer">عرضه (offer)</option><option value="request">تقاضا (request)</option></select>
<input id="title" placeholder="عنوان"><input id="category" placeholder="دسته (مثلاً art)">
<input id="hint" placeholder="قیمت پیشنهادی (متن آزاد)"><br>
<textarea id="desc" placeholder="توضیحات" rows="2" cols="50"></textarea><br>
<input id="images" placeholder="هش تصاویر، با ویرگول" size="50">
<button onclick="postL()">ارسال</button> <span id="st" class="muted"></span></section>

<section><h2>آگهی‌ها</h2><input id="q" placeholder="جستجو" oninput="load()">
<select id="fk" onchange="load()"><option value="">همه</option><option value="offer">عرضه</option><option value="request">تقاضا</option></select>
<div id="list"></div></section>

<section><h2>معامله (Proof of Trust)</h2>
<input id="did" placeholder="شناسه آگهی / پذیرش / رسید" size="40"><input id="buyer" placeholder="کلید عمومی خریدار" size="40"><br>
<button onclick="api('accept',{listing_id:v('did'),buyer:v('buyer')})">فروشنده: پذیرش خریدار</button>
<button onclick="stepD('buyer_paid')">خریدار: پرداخت شد (خارج از شبکه)</button>
<button onclick="stepD('seller_shipped')">فروشنده: ارسال شد</button>
<button onclick="stepD('buyer_confirmed')">خریدار: دریافت شد</button>
<button onclick="stepD('buyer_disputed')">خریدار: اعتراض</button>
<button onclick="api('claim',{accept_id:v('did'),reason:'not delivered'})">ادعای عدم تحویل</button><br>
<button onclick="api('complete',{listing_id:v('did'),buyer:v('buyer')})">فروشنده: رسید پایان معامله</button>
<select id="score"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select>
<button onclick="api('rate',{receipt_id:v('did'),score:+v('score'),comment:''})">خریدار: امتیاز</button>
<pre id="out" class="muted"></pre></section>

<script>
const v=id=>document.getElementById(id).value, $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,b){$('out').textContent='…';const r=await fetch('/api/'+p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});
 const t=await r.text();$('out').textContent=t;load();return t}
const stepD=s=>api('step',{accept_id:v('did'),step:s});
async function postL(){$('st').textContent='در حال ساخت مهر ضد اسپم…';
 const t=await api('post',{kind:v('kind'),title:v('title'),desc:v('desc'),price_hint:v('hint'),category:v('category'),images:v('images').split(',').map(s=>s.trim()).filter(Boolean)});$('st').textContent=t}
async function load(){const u=new URLSearchParams({q:v('q')});if(v('fk'))u.set('kind',v('fk'));
 const ls=await (await fetch('/api/listings?'+u)).json();
 $('list').innerHTML=ls.map(x=>`<div class="card"><b>${esc(x.listing.title)}</b> <span class="muted">[${x.listing.kind}] ${esc(x.listing.category)}</span><br>
 ${esc(x.listing.desc)}<br><span class="muted">قیمت: ${esc(x.listing.price_hint)} · فروشنده ${x.seller_pseudonym.slice(0,12)} · اعتبار ${x.rep?x.rep.mean.toFixed(2)+' ('+x.rep.count+')':'—'}</span><br>
 <code class="muted" onclick="$('did').value='${x.id}'">${x.id}</code></div>`).join('')||'<p class="muted">هنوز آگهی‌ای نیست</p>'}
fetch('/api/whoami').then(r=>r.json()).then(j=>$('me').textContent=j.pseudonym+' / '+j.pubkey);
const ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws');ws.onmessage=load;load();
</script></body></html>
