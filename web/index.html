<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Last-change</title>
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <header>
    <h1>Last-change</h1>
    <p class="legal" role="note">
      No token, no payments, no custody. Illegal goods and services are forbidden;
      pseudonymity does not exempt anyone from the law.
    </p>
    <p class="muted">Your pseudonym: <code id="me" aria-live="polite">…</code></p>
    <section id="login" aria-label="Keys"></section>
  </header>

  <main>
    <section aria-labelledby="post-h">
      <h2 id="post-h">Post</h2>
      <form id="create" class="stack">
        <label class="sr-only" for="kind">Kind</label>
        <select id="kind" name="kind">
          <option value="offer">Offer</option>
          <option value="request">Request</option>
        </select>
        <label class="sr-only" for="title">Title</label>
        <input id="title" name="title" required placeholder="Title" autocomplete="off">
        <div class="row">
          <label class="sr-only" for="category">Category</label>
          <input id="category" name="category" placeholder="Category (e.g. art)">
          <label class="sr-only" for="hint">Price hint</label>
          <input id="hint" name="hint" placeholder="Price hint (free text)">
        </div>
        <label class="sr-only" for="desc">Description</label>
        <textarea id="desc" name="desc" placeholder="Description"></textarea>
        <label class="sr-only" for="images">Image hashes</label>
        <input id="images" name="images" placeholder="Image hashes, comma separated">
        <div class="row">
          <button type="submit">Publish</button>
          <span id="st" class="muted" aria-live="polite"></span>
        </div>
      </form>
    </section>

    <section aria-labelledby="list-h">
      <h2 id="list-h">Listings</h2>
      <div class="row">
        <label class="sr-only" for="q">Search</label>
        <input id="q" type="search" placeholder="Search">
        <label class="sr-only" for="fk">Filter kind</label>
        <select id="fk">
          <option value="">All</option>
          <option value="offer">Offers</option>
          <option value="request">Requests</option>
        </select>
      </div>
      <div id="list"></div>
    </section>

    <section aria-labelledby="deal-h">
      <h2 id="deal-h">Deal (Proof of Trust)</h2>
      <div class="stack">
        <label class="sr-only" for="did">Listing / accept / receipt id</label>
        <input id="did" placeholder="Listing / accept / receipt id" autocomplete="off">
        <label class="sr-only" for="buyer">Buyer public key</label>
        <input id="buyer" placeholder="Buyer public key" autocomplete="off">
        <div class="row">
          <button type="button" data-deal="accept">Seller: accept buyer</button>
          <button type="button" class="secondary" data-deal="buyer-paid">Buyer: paid</button>
          <button type="button" class="secondary" data-deal="seller-shipped">Seller: shipped</button>
          <button type="button" class="secondary" data-deal="buyer-confirmed">Buyer: received</button>
          <button type="button" class="secondary" data-deal="buyer-disputed">Buyer: dispute</button>
          <button type="button" class="secondary" data-deal="claim">Non-delivery claim</button>
          <button type="button" class="secondary" data-deal="complete">Seller: deal receipt</button>
        </div>
        <div class="row">
          <label for="score">Score</label>
          <select id="score" aria-label="Rating score">
            <option>5</option><option>4</option><option>3</option><option>2</option><option>1</option>
          </select>
          <button type="button" id="btn-rate">Buyer: rate</button>
        </div>
        <pre id="out" class="muted" aria-live="polite"></pre>
      </div>
    </section>
  </main>
</body>
</html>
