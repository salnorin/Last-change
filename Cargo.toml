[workspace]
resolver = "2"
members = ["crates/core", "crates/ledger", "crates/reputation", "crates/net", "crates/node"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
rand = "0.8"
thiserror = "1"
anyhow = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
libp2p = { version = "0.54", features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "kad", "identify", "macros"] }
tempfile = "3"
lc-core = { path = "crates/core", package = "lastchange-core" }
lc-ledger = { path = "crates/ledger", package = "lastchange-ledger" }
lc-reputation = { path = "crates/reputation", package = "lastchange-reputation" }
lc-net = { path = "crates/net", package = "lastchange-net" }
